[project]
name = "eval-harness"
version = "0.1.0"
description = "Harness de avaliação para um LLM que extrai dados de cadastros de fornecedores."
requires-python = ">=3.12,<3.13"
dependencies = [
    "rich",
    "duckdb",
    "numpy",
    "google-genai",
]

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
